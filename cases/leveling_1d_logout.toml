#  leveling_1d_logout -- Capillary leveling of a small sinusoid on a periodic
#  1-D film, written at times spaced logarithmically: 7 decades, 20 a decade,
#  each landed on exactly (Output.FieldData.LogSchedule, ExactTimes). The
#  sinusoid decays as exp(-sigma h0^3 k^4 t / 3 mu) (tools/analytic.py,
#  leveling_logout); no concentration.
SolverName = "Yuzen-1.0"
InputFormatVersion = "1.0"
JobName = "leveling_1d_logout"

[Grid]
Dimension = "xh"
Xmin = -0.1875e-3
Xmax = 0.1875e-3
Ymin = -1
Ymax = 1
Nx = 64
Ny = 1
Nz = 1

[Initial]

[Initial.Concentration]
Type = "uniform"
Value = 0.5

[Initial.SurfaceShape]
TotalHeight = 10e-6
PrecursorRatio = 0.0

[Initial.SurfaceShape.PeriodicWave]
Order = 1
CreateType = "stack"
Base = 0.5
Amplitude = 1e-3
Phase = [0.0, 0.0]
Wavelength = [0.375e-3, 1.0]

[Substrate]
TotalHeight = 10e-6

[Fluid]
Name = "resist"

[Fluid.Density]
Value = 1000.0

[Fluid.SurfaceTension]
BaseValue = 30.0e-3
BaseConc = 0.5
Coef = 0.0

[Fluid.Viscosity]
BaseValue = 100.0e-3
BaseConc = 0.5
Exponent = 0.0

[Fluid.Diffusivity]
BaseValue = 1.0e-9
BaseConc = 0.5
Exponent = 0.0

[Fluid.MolarMass]
Solvent = 100
Resin = 2000

[Physics]

[Physics.ConcField]
Model = "None"

[Physics.LaplacePressure]
Enable = true

[Boundary]

[Boundary.XminBC]
Type = "Periodic"

[Boundary.XmaxBC]
Type = "Periodic"

[Boundary.YminBC]
Type = "Symmetry"

[Boundary.YmaxBC]
Type = "Symmetry"

[Output]
Dimensioned = true
Overwrite = true

[Output.FieldData]
NeutralFile = true
VTKFile = false

#  1e-7 s to 1 s, 20 a decade: 141 times. Each step that would pass one is
#  shortened to land on it, and the step after goes back to what it was.
[Output.FieldData.LogSchedule]
Start = 1e-7
End = 1.0
PerDecade = 20
ExactTimes = true

#  The other outputs cap the step at their interval: kept long
[Output.GeneralHistory]
TimeInterval = 0.1

[Output.CalcInfo]
TimeInterval = 0.1

[Output.ProbeList]
TimeInterval = 0.1

[Numerics]
InitialDt = 1e-8
EndTime = 1.0

[Numerics.TimeStepControl]
Enable = true
MaxDtFactor = 1.0e10
MinDt = 1.0e-15
Criterion = 1e-4
KeepSteps = 5
ChangeFactor = 0.75

[Numerics.HeightEquation]
NewtonMaxIterations = 50
NewtonEpsilon = 1e-12

[Numerics.HeightEquation.LinearSolver]
MaxIterations = 8000
Epsilon = 1e-13
RowScaling = true
PreconditionType = "ILU"

[Numerics.ConcEquation]

[Numerics.ConcEquation.LinearSolver]
MaxIterations = 5000
Epsilon = 1e-13
RowScaling = true
PreconditionType = "ILU"

[Restart]
Enable = false
FileName = "none.dat"
RestartTime = 0
FileIndex = 0
